[project]
name = "modified-utf-8-scanner"
version = "0.1.0"
description = "Parses Java-style Modified UTF-8 byte sequences where null and supplementary characters use two or six-byte surrogate pair encodings."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
